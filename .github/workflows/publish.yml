name: Publish vault site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege default: this job only needs to read the source repo - it publishes
# to a *different* repo using its own PUBLIC_REPO_TOKEN secret, not the auto-issued
# GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      # Third-party Actions are pinned to a commit SHA, not a version tag, since a tag
      # can be repointed (deliberately or via a compromised maintainer account) to
      # different, unreviewed code without this workflow file changing at all.
      - name: Checkout source repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      - name: Build site
        run: pnpm run site:build

      - name: Publish to public repo
        env:
          DEPLOY_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          TARGET_REPO: ${{ vars.PUBLIC_REPO }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_TOKEN:-}" ]; then
            echo "Missing secret PUBLIC_REPO_TOKEN (Settings > Secrets and variables > Actions)." >&2
            exit 1
          fi
          if [ -z "${TARGET_REPO:-}" ]; then
            echo "Missing repository variable PUBLIC_REPO (e.g. 'your-org/your-public-site')." >&2
            exit 1
          fi
          cd _site
          git init -q
          git checkout -q -b main
          git config user.name "tolaria-publish-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote add origin "https://x-access-token:${DEPLOY_TOKEN}@github.com/${TARGET_REPO}.git"
          git add -A
          git commit -q -m "Publish site $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force origin main
